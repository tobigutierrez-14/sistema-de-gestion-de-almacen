name: Integracion Continua

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    - name: Configurar SDK de .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restaurar dependencias
      run: dotnet restore SistemaGestion.slnx

    - name: Compilar solucion
      run: dotnet build SistemaGestion.slnx --no-restore

    - name: Ejecutar pruebas unitarias xUnit
      run: dotnet test SistemaGestion.slnx --no-build --verbosity normal